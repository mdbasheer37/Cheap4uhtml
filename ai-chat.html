<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Assistant — Cheap4U Technology</title>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="CSS/style.css">
</head>
<body>
  <div class="app-wrap">
    <div class="simple-topbar">
      <button class="back-btn" onclick="window.location.href='support.html'">←</button>
      <div class="simple-topbar__title">AI Assistant</div>
      <button class="btn btn-ghost btn-sm" id="clearChatBtn" style="margin-left:auto;">Clear</button>
    </div>

    <div class="page-content page-content--noheader">
      <div class="chat-wrap">
        <div class="chat-messages" id="chatMessages">
          <div class="chat-bubble chat-bubble--assistant">Hi! I'm your Cheap4U support assistant. Ask me about your wallet, transactions, data plans, or anything else — I'm here to help.</div>
        </div>
        <form class="chat-input-bar" id="chatForm">
          <input class="input" type="text" id="chatInput" placeholder="Type your message…" autocomplete="off">
          <button type="submit" class="btn btn-primary" id="chatSendBtn">Send</button>
        </form>
      </div>
    </div>
  </div>

  <script src="JS/config.js"></script>
  <script src="JS/api.js"></script>
  <script src="JS/utils.js"></script>
  <script src="JS/auth.js"></script>
  <script src="JS/support.js"></script>
</body>
</html>
