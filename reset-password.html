<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — Cheap4U Technology</title>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="CSS/style.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-card__logo">
        <img src="assets/logo.png" alt="Cheap4U" onerror="this.style.display='none'">
        <b>CHEAP4U TECHNOLOGY</b>
      </div>
      <h1>Set a new password</h1>
      <p class="sub" id="subText">Enter the OTP sent to your phone and choose a new password.</p>

      <form id="resetForm" novalidate>
        <div class="field" id="f-otp">
          <label for="otp">OTP code</label>
          <input class="input" type="text" id="otp" inputmode="numeric" maxlength="6" placeholder="6-digit code" required>
          <div class="field-error">Please enter the 6-digit OTP code.</div>
        </div>
        <div class="field" id="f-pw">
          <label for="newPassword">New password</label>
          <div class="input-group">
            <input class="input" type="password" id="newPassword" placeholder="Minimum 6 characters" required>
            <button type="button" class="input-group__icon" id="togglePw">👁️</button>
          </div>
          <div class="field-error">Password must be at least 6 characters.</div>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="resetBtn">Reset Password</button>
      </form>

      <p class="auth-switch">Back to <a href="login.html">Log in</a></p>
    </div>
  </div>

  <script src="JS/config.js"></script>
  <script src="JS/api.js"></script>
  <script src="JS/utils.js"></script>
  <script src="JS/auth.js"></script>
  <script>
    Auth.redirectIfLoggedIn();
    const userId = Utils.qparam('user_id');
    const phone = Utils.qparam('phone');
    if (!userId) window.location.href = 'forgot-password.html';
    if (phone) document.getElementById('subText').textContent = `Enter the OTP sent to ${phone} and choose a new password.`;

    document.getElementById('togglePw').addEventListener('click', () => {
      const pw = document.getElementById('newPassword');
      pw.type = pw.type === 'password' ? 'text' : 'password';
    });

    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const otp_code = document.getElementById('otp').value.trim();
      const new_password = document.getElementById('newPassword').value;

      let valid = true;
      const setErr = (id, ok) => { document.getElementById(id).classList.toggle('has-error', !ok); if (!ok) valid = false; };
      setErr('f-otp', /^\d{6}$/.test(otp_code));
      setErr('f-pw', new_password.length >= 6);
      if (!valid) return;

      const btn = document.getElementById('resetBtn');
      Utils.setButtonLoading(btn, true, 'Resetting…');
      try {
        const res = await Api.auth.resetPassword({ user_id: Number(userId), otp_code, new_password });
        Api.setSession(res.data.session_token, res.data.user);
        Utils.toast('Password reset successfully!', 'success');
        window.location.href = 'dashboard.html';
      } catch (err) {
        Utils.toast(err.message, 'error');
      } finally {
        Utils.setButtonLoading(btn, false);
      }
    });
  </script>
</body>
</html>
