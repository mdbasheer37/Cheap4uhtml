<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buy Data — Cheap4U Technology</title>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=block">
<link rel="stylesheet" href="CSS/style.css">
</head>
<body>
  <div class="app-wrap">
    <div class="simple-topbar">
      <button class="back-btn" onclick="history.back()"><span class="material-symbols-outlined">arrow_back</span></button>
      <div class="simple-topbar__title">Buy Data</div>
    </div>

    <div class="page-content page-content--noheader">
    <div class="card" id="formCard">
      <div class="card-title">Buy Data</div>
      <label class="small" style="font-weight:700;">Select Network</label>
      <div class="provider-grid" id="networkGrid"></div>

      <div class="chip-row" id="planTypeChips"></div>

      <div id="plansContainer">
        <div class="skel" style="height:56px;margin-bottom:8px;"></div>
        <div class="skel" style="height:56px;margin-bottom:8px;"></div>
        <div class="skel" style="height:56px;"></div>
      </div>

      <form id="dataForm" novalidate>
        <div class="field" id="f-phone">
          <label for="phone">Phone number</label>
          <input class="input" type="tel" id="phone" maxlength="11" placeholder="08012345678" required>
          <div class="field-error">Enter a valid 11-digit phone number.</div>
        </div>
        <div class="field">
          <label for="coupon">Coupon code <span class="text-muted">(optional)</span></label>
          <input class="input" type="text" id="coupon" placeholder="e.g. SAVE100">
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="submitBtn" disabled>Select a plan to continue</button>
      </form>
    </div>

    <div class="card hidden" id="resultCard"></div>
  </div>
  </div>

  <script src="JS/config.js"></script>
  <script src="JS/api.js"></script>
  <script src="JS/utils.js"></script>
  <script src="JS/auth.js"></script>
  <script src="JS/purchase.js"></script>
  <script src="JS/data.js"></script>
</body>
</html>
