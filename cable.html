<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cable TV — Cheap4U Technology</title>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="appShell" class="app-shell" data-page="services"></div>

  <main class="main-content" style="max-width:520px;">
    <div class="card" id="formCard">
      <div class="card-title">Cable TV Subscription</div>
      <label class="small" style="font-weight:700;">Select Provider</label>
      <div class="provider-grid" id="providerGrid">
        <div class="skel" style="height:70px;"></div><div class="skel" style="height:70px;"></div>
        <div class="skel" style="height:70px;"></div><div class="skel" style="height:70px;"></div>
      </div>

      <div id="plansContainer"></div>

      <form id="cableForm" novalidate>
        <div class="field" id="f-smartcard">
          <label for="smartcard">Smartcard / IUC number</label>
          <input class="input" type="text" id="smartcard" inputmode="numeric" placeholder="e.g. 1234567890" required>
          <div class="field-error">Enter a valid smartcard/IUC number (minimum 6 characters).</div>
        </div>
        <div class="field">
          <label for="coupon">Coupon code <span class="text-muted">(optional)</span></label>
          <input class="input" type="text" id="coupon" placeholder="e.g. SAVE100">
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="submitBtn" disabled>Select a plan to continue</button>
      </form>
    </div>

    <div class="card hidden" id="resultCard"></div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script src="js/purchase.js"></script>
  <script src="js/cable.js"></script>
</body>
</html>
