<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile — Cheap4U Technology</title>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=block">
<link rel="stylesheet" href="CSS/style.css">
</head>
<body>
  <div class="app-wrap">
    <div class="blob-header" style="border-radius:0 0 26px 26px;padding:16px 18px 40px;text-align:left;">
      <div style="display:flex;align-items:center;gap:14px;">
        <button class="back-btn" style="position:static;" onclick="history.back()"><span class="material-symbols-outlined">arrow_back</span></button>
        <h1 style="color:#fff;flex:1;text-align:center;margin-right:34px;">My Profile</h1>
      </div>
    </div>

    <div class="page-content page-content--noheader" style="margin-top:-30px;">
      <div class="card mb-16" id="profileHeaderCard" style="cursor:pointer;">
        <div style="display:flex;gap:16px;align-items:center;">
          <img src="assets/default_avatar.png" alt="Avatar" style="width:80px;height:80px;border-radius:50%;object-fit:cover;" onerror="this.style.display='none'">
          <div>
            <div style="font-size:19px;font-weight:800;" id="profName">Guest User</div>
            <div class="text-muted small" id="profTier">Standard Member</div>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:10px;margin-top:16px;">
          <span class="material-symbols-outlined" id="verifiedIcon" style="color:var(--red);font-size:22px;">shield_alert</span>
          <span id="verifiedLabel">Unverified Account</span>
        </div>
      </div>

      <div class="small text-muted" style="font-weight:700;letter-spacing:.5px;margin:0 0 8px 4px;">ACCOUNT INFORMATION</div>
      <div class="card mb-16">
        <div class="summary-list" style="margin:0;">
          <div style="display:flex;gap:14px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--gray-100);">
            <span class="material-symbols-outlined" style="color:var(--blue);">mail</span>
            <div><div class="text-muted small">Email Address</div><div id="profEmail">—</div></div>
          </div>
          <div style="display:flex;gap:14px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--gray-100);">
            <span class="material-symbols-outlined" style="color:var(--blue);">call</span>
            <div><div class="text-muted small">Phone Number</div><div id="profPhone">—</div></div>
          </div>
          <div style="display:flex;gap:14px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--gray-100);">
            <span class="material-symbols-outlined" style="color:var(--blue);">event</span>
            <div><div class="text-muted small">Member Since</div><div id="profJoined">—</div></div>
          </div>
          <div style="display:flex;gap:14px;align-items:flex-start;padding:10px 0;">
            <span class="material-symbols-outlined" style="color:var(--blue);">schedule</span>
            <div><div class="text-muted small">Last Active</div><div id="profLastActive">—</div></div>
          </div>
        </div>
      </div>

      <div class="flex flex-col gap-8">
        <button class="btn btn-outline btn-block" id="editProfileBtn">EDIT PROFILE</button>
        <button class="btn btn-outline btn-block" id="changePasswordBtn">CHANGE PASSWORD</button>
        <button class="btn btn-ghost btn-block" id="profitDashboardBtn" style="color:#9c27b0;font-weight:800;display:none;">PROFIT DASHBOARD</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="editProfileModal">
    <div class="modal-sheet">
      <div class="modal-header">
        <div class="modal-title">Edit Profile</div>
        <button class="modal-close" onclick="Utils.closeModal('editProfileModal')"><span class="material-symbols-outlined">close</span></button>
      </div>
      <div class="field">
        <label for="editName">Full Name</label>
        <input class="input" type="text" id="editName">
      </div>
      <div class="field">
        <label for="editEmail">Email</label>
        <input class="input" type="email" id="editEmail">
      </div>
      <div class="field">
        <label for="editPhone">Phone Number</label>
        <input class="input" type="tel" id="editPhone">
      </div>
      <button class="btn btn-primary btn-block" id="saveProfileBtn">SAVE</button>
    </div>
  </div>

  <div class="modal-backdrop" id="changePasswordModal">
    <div class="modal-sheet">
      <div class="modal-header">
        <div class="modal-title">Change Password</div>
        <button class="modal-close" onclick="Utils.closeModal('changePasswordModal')"><span class="material-symbols-outlined">close</span></button>
      </div>
      <p class="small text-muted mb-16">For your security, we'll text a one-time code to your phone to confirm this change.</p>
      <div class="field">
        <label for="cpNewPassword">New Password</label>
        <input class="input" type="password" id="cpNewPassword" placeholder="Minimum 6 characters">
      </div>
      <div class="field">
        <label for="cpConfirmPassword">Confirm New Password</label>
        <input class="input" type="password" id="cpConfirmPassword">
      </div>
      <button class="btn btn-primary btn-block" id="updatePasswordBtn">UPDATE</button>
    </div>
  </div>

  <script src="JS/config.js"></script>
  <script src="JS/api.js"></script>
  <script src="JS/utils.js"></script>
  <script src="JS/auth.js"></script>
  <script src="JS/my-profile.js"></script>
</body>
</html>
