<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coupons — Cheap4U Technology</title>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=block">
<link rel="stylesheet" href="CSS/style.css">
</head>
<body>
  <div class="app-wrap">
    <div class="simple-topbar">
      <button class="back-btn" onclick="history.back()"><span class="material-symbols-outlined">arrow_back</span></button>
      <div class="simple-topbar__title">Coupons</div>
    </div>

    <div class="page-content page-content--noheader">
    <div class="card mb-16">
      <div class="card-title">Validate a Coupon</div>
      <form id="validateForm" class="flex gap-8" style="flex-wrap:wrap;">
        <input class="input" type="text" id="couponCode" placeholder="Coupon code" style="flex:1;min-width:140px;">
        <select class="input" id="couponCategory" style="max-width:150px;">
          <option value="">Any category</option>
          <option value="airtime">Airtime</option>
          <option value="data">Data</option>
          <option value="electricity">Electricity</option>
          <option value="cable_tv">Cable TV</option>
          <option value="exam_pin">Exam PIN</option>
        </select>
        <input class="input" type="number" id="couponAmount" placeholder="Amount ₦" style="max-width:130px;">
        <button type="submit" class="btn btn-primary" id="validateBtn">Check</button>
      </form>
      <div id="validateResult" class="mt-16"></div>
    </div>

    <div class="section-header"><h2>My Coupons</h2></div>
    <div class="card mb-16" id="myCoupons"><div class="skel" style="height:50px;"></div></div>

    <div class="section-header"><h2>Spin & Win Coupons</h2></div>
    <div class="card" id="spinCoupons"><div class="skel" style="height:50px;"></div></div>
  </div>
  </div>

  <script src="JS/config.js"></script>
  <script src="JS/api.js"></script>
  <script src="JS/utils.js"></script>
  <script src="JS/auth.js"></script>
  <script src="JS/coupons.js"></script>
</body>
</html>
