<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile & Settings — Cheap4U Technology</title>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="appShell" class="app-shell" data-page="profile"></div>

  <main class="main-content" style="max-width:560px;">
    <div class="card mb-16" style="text-align:center;">
      <div class="avatar" style="width:64px;height:64px;font-size:22px;margin:0 auto 12px;" id="bigAvatar">?</div>
      <h3 id="profName" style="font-size:18px;font-weight:800;">—</h3>
      <p class="text-muted small" id="profEmail">—</p>
      <div class="flex gap-8" style="justify-content:center;margin-top:10px;">
        <span class="badge badge--success" id="verifiedBadge" style="display:none;">Verified</span>
        <span class="badge badge--pending" id="premiumBadge" style="display:none;">Premium</span>
      </div>
    </div>

    <div class="card mb-16">
      <div class="card-title">Account Details</div>
      <div class="summary-list">
        <div class="summary-row"><span>Phone</span><span id="profPhone">—</span></div>
        <div class="summary-row"><span>Referral Code</span><span id="profRefCode">—</span></div>
        <div class="summary-row"><span>Joined</span><span id="profJoined">—</span></div>
        <div class="summary-row"><span>Last Login</span><span id="profLastLogin">—</span></div>
      </div>
    </div>

    <div class="card mb-16">
      <div class="card-title">Transaction PIN</div>
      <p class="small text-muted mb-16">Your PIN authorizes airtime, data, electricity, cable and exam PIN purchases.</p>
      <form id="pinForm" novalidate>
        <div class="field">
          <label for="oldPin">Current PIN <span class="text-muted">(leave blank if setting for the first time)</span></label>
          <input class="input" type="password" id="oldPin" inputmode="numeric" maxlength="6" placeholder="••••">
        </div>
        <div class="field" id="f-newpin">
          <label for="newPin">New PIN (4–6 digits)</label>
          <input class="input" type="password" id="newPin" inputmode="numeric" maxlength="6" placeholder="••••">
          <div class="field-error">PIN must be 4–6 digits.</div>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="pinBtn">Save PIN</button>
      </form>
    </div>

    <div class="card mb-16">
      <div class="card-title">Legal</div>
      <div class="flex flex-col gap-8">
        <a href="#" id="privacyLink" target="_blank" class="btn btn-outline btn-block">Privacy Policy</a>
        <a href="#" id="termsLink" target="_blank" class="btn btn-outline btn-block">Terms of Service</a>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Account</div>
      <div class="flex flex-col gap-8">
        <button class="btn btn-outline btn-block" data-action="logout">Log Out</button>
        <a href="#" id="deleteAccountLink" target="_blank" class="btn btn-danger btn-block">Delete Account</a>
      </div>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
