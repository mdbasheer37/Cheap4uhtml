<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile — Cheap4U Technology</title>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="CSS/style.css">
</head>
<body>
  <div class="app-wrap">
    <div class="blob-header" style="border-radius:0 0 26px 26px;padding:20px 18px;text-align:left;">
      <button class="back-btn" style="position:static;margin-bottom:10px;" onclick="history.back()">←</button>
      <h1 style="color:#fff;text-align:center;margin-top:-30px;">Profile</h1>
    </div>

    <div class="page-content page-content--noheader" style="padding-left:0;padding-right:0;">
      <div class="menu-list">
        <div class="menu-item" onclick="window.location.href='referral.html'"><span class="ic">👥</span><span>Show My Referrals</span><span class="chev">›</span></div>
        <div class="menu-item" onclick="window.location.href='challenge.html'"><span class="ic">🏆</span><span>Monthly Challenge</span><span class="chev">›</span></div>
        <div class="menu-item" onclick="window.location.href='challenge.html'"><span class="ic">🎖️</span><span>Winners History</span><span class="chev">›</span></div>
        <div class="menu-item" id="themesItem"><span class="ic">🌓</span><span>Themes</span><span class="chev">›</span></div>
        <div class="menu-item" id="settingsItem"><span class="ic">⚙️</span><span>Settings</span><span class="chev">›</span></div>
        <div class="menu-item" id="securityItem"><span class="ic">🛡️</span><span>Security</span><span class="chev">›</span></div>
        <div class="menu-item" id="setPinItem"><span class="ic">🔒</span><span>Set Transaction PIN</span><span class="chev">›</span></div>
        <div class="menu-item" id="legalItem"><span class="ic">📄</span><span>Legal</span><span class="chev">›</span></div>
        <div class="menu-item danger" id="deleteAccountItem"><span class="ic">🗑️</span><span>Account Deletion</span><span class="chev">›</span></div>
      </div>

      <div style="padding:20px;">
        <button class="btn btn-danger btn-block" data-action="logout">LOGOUT</button>
      </div>
    </div>

    <div id="bottomNav" data-page="profile"></div>
  </div>

  <div class="modal-backdrop" id="pinModal">
    <div class="modal-sheet">
      <div class="modal-header">
        <div class="modal-title">Set Transaction PIN</div>
        <button class="modal-close" onclick="Utils.closeModal('pinModal')">✕</button>
      </div>
      <p class="small text-muted mb-16">Your PIN authorizes airtime, data, electricity, cable and exam PIN purchases.</p>
      <form id="pinForm" novalidate>
        <div class="field">
          <label for="oldPin">Current PIN <span class="text-muted">(leave blank if setting for the first time)</span></label>
          <input class="input" type="password" id="oldPin" inputmode="numeric" maxlength="6" placeholder="••••">
        </div>
        <div class="field">
          <label for="newPin">New PIN (4–6 digits)</label>
          <input class="input" type="password" id="newPin" inputmode="numeric" maxlength="6" placeholder="••••">
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="pinBtn">Save PIN</button>
      </form>
    </div>
  </div>

  <div class="modal-backdrop" id="settingsModal">
    <div class="modal-sheet">
      <div class="modal-header">
        <div class="modal-title">Settings</div>
        <button class="modal-close" onclick="Utils.closeModal('settingsModal')">✕</button>
      </div>
      <div class="menu-item" style="padding-left:0;">
        <span>Enable notifications</span>
        <label class="chev" style="margin-left:auto;">
          <input type="checkbox" id="notifToggle">
        </label>
      </div>
      <button class="btn btn-primary btn-block mt-16" onclick="saveLocalSettings()">SAVE</button>
    </div>
  </div>

  <script src="JS/config.js"></script>
  <script src="JS/api.js"></script>
  <script src="JS/utils.js"></script>
  <script src="JS/auth.js"></script>
  <script src="JS/app.js"></script>
  <script src="JS/profile.js"></script>
</body>
</html>
