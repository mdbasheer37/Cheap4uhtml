<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dollar Card — Cheap4U Technology</title>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="CSS/style.css">
</head>
<body>
  <div class="app-wrap">
    <div class="simple-topbar">
      <button class="back-btn" onclick="history.back()">←</button>
      <div class="simple-topbar__title">Dollar Card</div>
    </div>

    <div class="page-content page-content--noheader" id="cardsContent">
      <div class="skel" style="height:160px;margin-bottom:16px;"></div>
    </div>
  </div>

  <div class="modal-backdrop" id="createCardModal">
    <div class="modal-sheet">
      <div class="modal-header">
        <div class="modal-title">Create a Dollar Card</div>
        <button class="modal-close" onclick="Utils.closeModal('createCardModal')">✕</button>
      </div>
      <p class="small text-muted mb-16" id="createCardHint"></p>
      <div class="field">
        <label for="fundAmount">Initial funding (USD)</label>
        <input class="input" type="number" id="fundAmount" min="0" step="0.01" placeholder="e.g. 5.00">
      </div>
      <button class="btn btn-primary btn-block" id="createCardBtn">Create Card</button>
    </div>
  </div>

  <script src="JS/config.js"></script>
  <script src="JS/api.js"></script>
  <script src="JS/utils.js"></script>
  <script src="JS/auth.js"></script>
  <script src="JS/card.js"></script>
</body>
</html>
