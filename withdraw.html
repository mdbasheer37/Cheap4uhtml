<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Withdraw Profit — Cheap4U Technology</title>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=block">
<link rel="stylesheet" href="CSS/style.css">
</head>
<body>
  <div class="app-wrap">
    <div class="blob-header" style="border-radius:0 0 26px 26px;padding:18px;text-align:left;">
      <div style="display:flex;align-items:center;gap:14px;">
        <button class="back-btn" style="position:static;" onclick="window.location.href='profit.html'"><span class="material-symbols-outlined">arrow_back</span></button>
        <h1 style="color:#fff;flex:1;text-align:center;margin-right:34px;">Withdraw Profit</h1>
      </div>
    </div>

    <div class="page-content page-content--noheader" style="margin-top:-20px;">
      <div class="gradient-card gradient-card--green mb-16 text-center">
        <div>Available Balance</div>
        <div style="font-size:32px;font-weight:800;" id="availableBalance">—</div>
      </div>

      <div class="card">
        <form id="withdrawForm" novalidate>
          <div class="field">
            <label for="amount">Amount to withdraw</label>
            <input class="input" type="number" id="amount" min="100" max="500000" required>
            <div class="field-hint">Minimum ₦100, maximum ₦500,000</div>
          </div>
          <div class="field">
            <label>Bank</label>
            <input class="input" type="text" id="bankDisplay" placeholder="Tap to select bank" readonly style="cursor:pointer;">
          </div>
          <div class="field">
            <label for="accountNumber">Account Number (10 digits)</label>
            <input class="input" type="text" id="accountNumber" inputmode="numeric" maxlength="10" required>
          </div>
          <button type="submit" class="btn btn-primary btn-block" id="withdrawBtn">PROCEED WITH WITHDRAWAL</button>
        </form>
        <p class="text-center mt-16"><a href="profit.html" style="color:var(--blue);font-weight:700;">Back to Profit Dashboard</a></p>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="bankModal">
    <div class="modal-sheet">
      <div class="modal-header">
        <div class="modal-title">Select Bank</div>
        <button class="modal-close" onclick="Utils.closeModal('bankModal')"><span class="material-symbols-outlined">close</span></button>
      </div>
      <input class="input mb-16" type="text" id="bankSearch" placeholder="Search banks…">
      <div id="bankList" style="max-height:50vh;overflow-y:auto;"><div class="skel" style="height:200px;"></div></div>
    </div>
  </div>

  <script src="JS/config.js"></script>
  <script src="JS/api.js"></script>
  <script src="JS/utils.js"></script>
  <script src="JS/auth.js"></script>
  <script src="JS/withdraw.js"></script>
</body>
</html>
