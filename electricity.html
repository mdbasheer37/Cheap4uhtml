<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pay Electricity — Cheap4U Technology</title>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=block">
<link rel="stylesheet" href="CSS/style.css">
</head>
<body>
  <div class="app-wrap">
    <div class="simple-topbar">
      <button class="back-btn" onclick="history.back()"><span class="material-symbols-outlined">arrow_back</span></button>
      <div class="simple-topbar__title">Pay Electricity Bill</div>
    </div>

    <div class="page-content page-content--noheader">
    <div class="card" id="formCard">
      <div class="card-title">Pay Electricity Bill</div>

      <div class="field">
        <label for="disco">Electricity Provider (Disco)</label>
        <select class="input" id="disco"><option value="">Loading providers…</option></select>
      </div>

      <form id="electricityForm" novalidate>
        <div class="field">
          <label>Meter Type</label>
          <div class="chip-row" id="meterTypeChips">
            <div class="chip active" data-type="prepaid">Prepaid</div>
            <div class="chip" data-type="postpaid">Postpaid</div>
          </div>
        </div>
        <div class="field" id="f-meter">
          <label for="meter">Meter number</label>
          <input class="input" type="text" id="meter" inputmode="numeric" placeholder="e.g. 04012345678" required>
          <div class="field-error">Enter a valid meter number (minimum 6 digits).</div>
        </div>
        <div class="field" id="f-phone">
          <label for="phone">Phone number</label>
          <input class="input" type="tel" id="phone" maxlength="11" placeholder="08012345678" required>
          <div class="field-error">Enter a valid 11-digit phone number.</div>
        </div>
        <div class="field" id="f-amount">
          <label for="amount">Amount (min ₦50)</label>
          <input class="input" type="number" id="amount" min="50" placeholder="e.g. 3000" required>
          <div class="field-error">Enter an amount of at least ₦50.</div>
        </div>
        <div class="field">
          <label for="coupon">Coupon code <span class="text-muted">(optional)</span></label>
          <input class="input" type="text" id="coupon" placeholder="e.g. SAVE100">
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Continue</button>
      </form>
    </div>

    <div class="card hidden" id="resultCard"></div>
  </div>
  </div>

  <script src="JS/config.js"></script>
  <script src="JS/api.js"></script>
  <script src="JS/utils.js"></script>
  <script src="JS/auth.js"></script>
  <script src="JS/purchase.js"></script>
  <script src="JS/electricity.js"></script>
</body>
</html>
