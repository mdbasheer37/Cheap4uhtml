<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password — Cheap4U Technology</title>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="CSS/style.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-card__logo">
        <img src="assets/logo.png" alt="Cheap4U" onerror="this.style.display='none'">
        <b>CHEAP4U TECHNOLOGY</b>
      </div>
      <h1>Reset your password</h1>
      <p class="sub">Enter the email or phone number linked to your account.</p>

      <form id="forgotForm" novalidate>
        <div class="field" id="f-id">
          <label for="identifier">Email or phone number</label>
          <input class="input" type="text" id="identifier" placeholder="you@example.com or 08012345678" required>
          <div class="field-error">Please enter your email or phone number.</div>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="sendBtn">Send OTP</button>
      </form>

      <p class="auth-switch">Remembered your password? <a href="login.html">Log in</a></p>
    </div>
  </div>

  <script src="JS/config.js"></script>
  <script src="JS/api.js"></script>
  <script src="JS/utils.js"></script>
  <script src="JS/auth.js"></script>
  <script>
    Auth.redirectIfLoggedIn();

    document.getElementById('forgotForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const value = document.getElementById('identifier').value.trim();
      if (!value) { document.getElementById('f-id').classList.add('has-error'); return; }
      document.getElementById('f-id').classList.remove('has-error');

      const payload = Utils.isValidEmail(value) ? { email: value } : { phone: value };
      const btn = document.getElementById('sendBtn');
      Utils.setButtonLoading(btn, true, 'Sending…');
      try {
        const res = await Api.auth.forgotPassword(payload);
        Utils.toast(res.message || 'OTP sent', 'success');
        if (res.data && res.data.user_id) {
          window.location.href = `reset-password.html?user_id=${res.data.user_id}&phone=${encodeURIComponent(res.data.phone || '')}`;
        } else {
          Utils.toast('If this account exists, an OTP has been sent. Check your phone.', 'info', 5000);
        }
      } catch (err) {
        Utils.toast(err.message, 'error');
      } finally {
        Utils.setButtonLoading(btn, false);
      }
    });
  </script>
</body>
</html>
