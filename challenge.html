<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monthly Challenge — Cheap4U Technology</title>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="CSS/style.css">
</head>
<body>
  <div class="app-wrap">
    <div class="simple-topbar">
      <button class="back-btn" onclick="history.back()">←</button>
      <div class="simple-topbar__title">Monthly Challenge</div>
    </div>

    <div class="page-content page-content--noheader">
    <div class="gradient-card gradient-card--amber mb-16">
      <div class="balance-card__label">Your Rank This Month</div>
      <div class="balance-card__amount" id="myRank">—</div>
      <p class="small mt-8" style="opacity:.9;" id="myStanding"></p>
    </div>

    <div class="stat-row">
      <div class="stat-card"><div class="stat-card__label">My Purchases</div><div class="stat-card__value" id="myTotal">—</div></div>
      <div class="stat-card"><div class="stat-card__label">Participants</div><div class="stat-card__value" id="totalParticipants">—</div></div>
      <div class="stat-card"><div class="stat-card__label">To Overtake Next</div><div class="stat-card__value" id="overtake">—</div></div>
      <div class="stat-card"><div class="stat-card__label">Time Left</div><div class="stat-card__value" id="countdown">—</div></div>
    </div>

    <div class="section-header">
      <h2>Leaderboard</h2>
      <span class="link-see-all" id="notifBell">🔔 <span id="unreadCount"></span></span>
    </div>
    <div class="card mb-16" id="leaderboardList"><div class="skel" style="height:60px;"></div></div>

    <div class="section-header"><h2>Past Winners</h2></div>
    <div class="card" id="winnersList"><div class="skel" style="height:60px;"></div></div>
  </div>
  </div>

  <div class="modal-backdrop" id="notifModal">
    <div class="modal-sheet">
      <div class="modal-header">
        <div class="modal-title">Notifications</div>
        <button class="modal-close" onclick="Utils.closeModal('notifModal')">✕</button>
      </div>
      <div id="notifList"></div>
    </div>
  </div>

  <script src="JS/config.js"></script>
  <script src="JS/api.js"></script>
  <script src="JS/utils.js"></script>
  <script src="JS/auth.js"></script>
  <script src="JS/challenge.js"></script>
</body>
</html>
