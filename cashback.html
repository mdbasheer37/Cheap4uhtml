<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cashback — Cheap4U Technology</title>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="appShell" class="app-shell" data-page="cashback"></div>

  <main class="main-content">
    <div class="gradient-card gradient-card--green mb-16">
      <div class="balance-card__label">Cashback Balance</div>
      <div class="balance-card__amount" id="cbBalance">—</div>
      <p class="small mt-8" style="opacity:.9;" id="cbExpiryMsg"></p>
      <button class="btn btn-secondary btn-sm mt-16" id="redeemBtn" style="background:rgba(255,255,255,.22);color:#fff;">Redeem to Wallet</button>
    </div>

    <div class="stat-row">
      <div class="stat-card"><div class="stat-card__label">Total Earned</div><div class="stat-card__value" id="cbEarned">—</div></div>
      <div class="stat-card"><div class="stat-card__label">Total Redeemed</div><div class="stat-card__value" id="cbRedeemed">—</div></div>
    </div>

    <div class="section-header"><h2>Cashback Rates</h2></div>
    <div class="card mb-16" id="ratesCard"><div class="skel" style="height:90px;"></div></div>

    <div class="section-header"><h2>Cashback History</h2></div>
    <div class="card" id="historyList"><div class="skel" style="height:50px;"></div></div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script src="js/cashback.js"></script>
</body>
</html>
