<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buy Airtime — Cheap4U Technology</title>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="appShell" class="app-shell" data-page="services"></div>

  <main class="main-content" style="max-width:520px;">
    <div class="card" id="formCard">
      <div class="card-title">Buy Airtime</div>
      <label class="small" style="font-weight:700;">Select Network</label>
      <div class="provider-grid" id="networkGrid"></div>

      <form id="airtimeForm" novalidate>
        <div class="field" id="f-phone">
          <label for="phone">Phone number</label>
          <input class="input" type="tel" id="phone" maxlength="11" placeholder="08012345678" required>
          <div class="field-error">Enter a valid 11-digit phone number.</div>
        </div>
        <div class="field" id="f-amount">
          <label for="amount">Amount (min ₦50)</label>
          <input class="input" type="number" id="amount" min="50" placeholder="e.g. 500" required>
          <div class="field-error">Enter an amount of at least ₦50.</div>
        </div>
        <div class="chip-row" id="quickAmounts"></div>
        <div class="field">
          <label for="coupon">Coupon code <span class="text-muted">(optional)</span></label>
          <input class="input" type="text" id="coupon" placeholder="e.g. SAVE100">
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Continue</button>
      </form>
    </div>

    <div class="card hidden" id="resultCard"></div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script src="js/purchase.js"></script>
  <script src="js/airtime.js"></script>
</body>
</html>
