<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account — Cheap4U Technology</title>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=block">
<link rel="stylesheet" href="CSS/style.css">
</head>
<body>
  <div class="app-wrap auth-page">
    <div class="blob-header blob-header--dark">
      <h1>Create Account</h1>
    </div>

    <div class="auth-card-wrap">
      <div class="auth-card">
        <form id="registerForm" novalidate>
          <div class="auth-field" id="f-name">
            <span class="ic"><span class="material-symbols-outlined">person</span></span>
            <input type="text" id="name" placeholder="Full Name" autocomplete="name" required>
          </div>
          <div class="auth-field" id="f-email">
            <span class="ic"><span class="material-symbols-outlined">mail</span></span>
            <input type="email" id="email" placeholder="Email" autocomplete="email" required>
          </div>
          <div class="auth-field" id="f-phone">
            <span class="ic"><span class="material-symbols-outlined">call</span></span>
            <input type="tel" id="phone" placeholder="Phone Number" maxlength="11" autocomplete="tel" required>
          </div>
          <div class="auth-field" style="border-color:var(--gray-200);">
            <span class="ic" style="color:var(--gray-500);"><span class="material-symbols-outlined">add</span></span>
            <input type="text" id="ref" placeholder="Referral Code (Optional)" style="color:var(--gray-900);">
          </div>
          <div class="auth-field" id="f-password">
            <span class="ic"><span class="material-symbols-outlined">lock</span></span>
            <input type="password" id="password" placeholder="Password" autocomplete="new-password" required>
            <button type="button" class="input-group__icon" id="togglePw" style="position:static;margin-left:4px;"><span class="material-symbols-outlined">visibility</span></button>
          </div>
          <div class="auth-field" id="f-confirm">
            <span class="ic"><span class="material-symbols-outlined">lock</span></span>
            <input type="password" id="confirmPassword" placeholder="Confirm Password" autocomplete="new-password" required>
            <button type="button" class="input-group__icon" id="toggleConfirmPw" style="position:static;margin-left:4px;"><span class="material-symbols-outlined">visibility</span></button>
          </div>
          <button type="submit" class="btn btn-primary btn-block" id="registerBtn">REGISTER</button>
        </form>
      </div>

      <p class="auth-switch">Already have an account? <a href="login.html?full=1">Login Here</a></p>
    </div>
  </div>

  <script src="JS/config.js"></script>
  <script src="JS/api.js"></script>
  <script src="JS/utils.js"></script>
  <script src="JS/auth.js"></script>
  <script>
    Auth.redirectIfLoggedIn();

    document.getElementById('togglePw').addEventListener('click', () => {
      const pw = document.getElementById('password');
      pw.type = pw.type === 'password' ? 'text' : 'password';
    });
    document.getElementById('toggleConfirmPw').addEventListener('click', () => {
      const pw = document.getElementById('confirmPassword');
      pw.type = pw.type === 'password' ? 'text' : 'password';
    });


    const refFromLink = Utils.qparam('ref');
    if (refFromLink) document.getElementById('ref').value = refFromLink;

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const referral_code = document.getElementById('ref').value.trim();

      let valid = true;
      const setErr = (id, ok) => { document.getElementById(id).classList.toggle('has-error', !ok); if (!ok) valid = false; };
      setErr('f-name', name.length > 1);
      setErr('f-email', Utils.isValidEmail(email));
      setErr('f-phone', Utils.isValidPhone(phone));
      setErr('f-password', password.length >= 6);
      setErr('f-confirm', confirmPassword === password && confirmPassword.length >= 6);
      if (!valid) {
        if (password.length >= 6 && confirmPassword !== password) {
          Utils.toast('Passwords do not match', 'error');
        } else {
          Utils.toast('Please check the highlighted fields', 'error');
        }
        return;
      }

      const btn = document.getElementById('registerBtn');
      Utils.setButtonLoading(btn, true, 'Creating account…');
      try {
        const res = await Api.auth.register({ name, email, phone, password, referral_code });
        Utils.toast(res.message || 'Account created', 'success');
        window.location.href = `verify-otp.html?user_id=${res.data.user_id}&phone=${encodeURIComponent(res.data.phone || phone)}`;
      } catch (err) {
        Utils.toast(err.message, 'error');
      } finally {
        Utils.setButtonLoading(btn, false);
      }
    });
  </script>
</body>
</html>
