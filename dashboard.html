<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Cheap4U Technology</title>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="CSS/style.css">
</head>
<body>
  <div class="app-wrap">
    <div class="home-header">
      <div class="home-header__greeting">
        <span class="ic">👤</span>
        <span id="greetingName">Hi there</span>
      </div>
      <button class="home-header__bell" id="notifBell">🔔<span class="notif-dot hidden" id="notifDot"></span></button>
    </div>

    <div class="balance-card">
      <div class="balance-card__label">Wallet Balance</div>
      <div class="balance-card__amount" id="walletBalance"><span class="skel" style="display:inline-block;width:120px;height:26px;"></span></div>
      <div class="balance-card__refrow">
        <span>Referral Balance</span>
        <span id="referralBalance">₦0.00</span>
      </div>
    </div>

    <div class="challenge-card">
      <div class="challenge-card__top">
        <div class="challenge-card__title">Monthly Champion Challenge</div>
        <div class="challenge-card__timer" id="challengeTimer">—</div>
      </div>
      <div class="challenge-card__stats">
        <div>
          <div class="challenge-card__stat-label">Your Rank</div>
          <div class="challenge-card__stat-value" id="challengeRank">—</div>
        </div>
        <div style="text-align:right;">
          <div class="challenge-card__stat-label">Monthly Purchases</div>
          <div class="challenge-card__stat-value" id="challengeTotal">—</div>
        </div>
      </div>
      <div class="challenge-card__note" id="challengeNote"></div>
      <div class="challenge-card__actions">
        <a href="challenge.html" class="btn btn-white">VIEW LEADERBOARD</a>
      </div>
    </div>

    <div class="account-number-card" id="accountNumberCard">
      <div class="account-number-card__label">Your account number</div>
      <div class="skel" style="height:24px;"></div>
    </div>

    <div class="section-title">Quick Actions</div>
    <div class="grid-4" id="quickActionsGrid"></div>

    <div class="section-title">Services</div>
    <div class="grid-3" id="servicesGrid"></div>

    <div id="bottomNav" data-page="dashboard"></div>
  </div>

  <div class="modal-backdrop" id="notifModal">
    <div class="modal-sheet">
      <div class="modal-header">
        <div class="modal-title">Notifications</div>
        <button class="modal-close" onclick="Utils.closeModal('notifModal')">✕</button>
      </div>
      <div id="notifList"></div>
    </div>
  </div>

  <script src="JS/config.js"></script>
  <script src="JS/api.js"></script>
  <script src="JS/utils.js"></script>
  <script src="JS/auth.js"></script>
  <script src="JS/app.js"></script>
  <script src="JS/nav-grids.js"></script>
  <script src="JS/dashboard.js"></script>
</body>
</html>
