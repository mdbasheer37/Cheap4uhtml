<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Support Center — Cheap4U Technology</title>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=block">
<link rel="stylesheet" href="CSS/style.css">
</head>
<body>
  <div class="app-wrap">
    <div class="support-hero">
      <h1>Need Help?</h1>
      <p>We're here to assist you 24/7.</p>
    </div>

    <div class="support-tile support-tile--primary" onclick="window.location.href='ai-chat.html'">
      <div class="support-tile__icon"><span class="material-symbols-outlined">smart_toy</span></div>
      <div style="flex:1;">
        <div class="support-tile__title">AI Assistant</div>
        <div class="support-tile__sub">Get instant answers, 24/7</div>
        <div class="support-tile__sub"><span class="status-dot"></span>Online now</div>
      </div>
      <div class="chev">›</div>
    </div>

    <div class="support-tile" id="phoneSupportTile">
      <div class="support-tile__icon"><span class="material-symbols-outlined">call</span></div>
      <div style="flex:1;">
        <div class="support-tile__title">Phone Support</div>
        <div class="support-tile__sub" id="phoneSupportSub">Tap to Call</div>
      </div>
      <div class="chev">›</div>
    </div>

    <div class="support-tile" id="emailSupportTile">
      <div class="support-tile__icon"><span class="material-symbols-outlined">mail</span></div>
      <div style="flex:1;">
        <div class="support-tile__title">Email Support</div>
        <div class="support-tile__sub" id="emailSupportSub">—</div>
      </div>
      <div class="chev">›</div>
    </div>

    <div class="text-center text-muted small mt-24">
      <p><b>Business Hours</b></p>
      <p id="businessHours">Monday - Sunday · 24 Hours Support</p>
      <p class="mt-8">Version 1.0.0</p>
    </div>

    <div id="bottomNav" data-page="support" style="margin-top:24px;"></div>
    <div style="height:80px;"></div>
  </div>

  <script src="JS/config.js"></script>
  <script src="JS/api.js"></script>
  <script src="JS/utils.js"></script>
  <script src="JS/auth.js"></script>
  <script src="JS/app.js"></script>
  <script>
    async function loadContactInfo() {
      try {
        const res = await Api.chat.contactInfo();
        const d = res.data;
        document.getElementById('phoneSupportSub').textContent = `Tap to Call · ${d.phone}`;
        document.getElementById('emailSupportSub').textContent = d.email;
        document.getElementById('businessHours').textContent = d.business_hours;
        document.getElementById('phoneSupportTile').addEventListener('click', () => { window.location.href = `tel:${d.phone}`; });
        document.getElementById('emailSupportTile').addEventListener('click', () => { window.location.href = `mailto:${d.email}`; });
      } catch {
        document.getElementById('phoneSupportSub').textContent = `Tap to Call · ${CONFIG.SUPPORT_PHONE}`;
        document.getElementById('emailSupportSub').textContent = CONFIG.SUPPORT_EMAIL;
        document.getElementById('phoneSupportTile').addEventListener('click', () => { window.location.href = `tel:${CONFIG.SUPPORT_PHONE}`; });
        document.getElementById('emailSupportTile').addEventListener('click', () => { window.location.href = `mailto:${CONFIG.SUPPORT_EMAIL}`; });
      }
    }
    Auth.guard(loadContactInfo);
  </script>
</body>
</html>
