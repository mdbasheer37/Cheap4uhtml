<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Support — Cheap4U Technology</title>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="appShell" class="app-shell" data-page="support"></div>

  <main class="main-content">
    <div class="chat-wrap">
      <div class="flex" style="justify-content:space-between;align-items:center;margin-bottom:8px;">
        <p class="small text-muted" id="contactInfoLine">Cheap4U Support Assistant</p>
        <button class="btn btn-ghost btn-sm" id="clearChatBtn">Clear chat</button>
      </div>
      <div class="chat-messages" id="chatMessages">
        <div class="chat-bubble chat-bubble--assistant">Hi! I'm your Cheap4U support assistant. Ask me about your wallet, transactions, data plans, or anything else — I'm here to help.</div>
      </div>
      <form class="chat-input-bar" id="chatForm">
        <input class="input" type="text" id="chatInput" placeholder="Type your message…" autocomplete="off">
        <button type="submit" class="btn btn-primary" id="chatSendBtn">Send</button>
      </form>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script src="js/support.js"></script>
</body>
</html>
